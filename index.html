<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💜 For You 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
*,*::before,*::after{animation:none!important;}

:root{
  --lav:#c084fc;
  --purple:#7c3aed;
  --deep:#2e1065;
  --soft:#e9d5ff;
}
body{
  min-height:100vh;
  font-family:'Quicksand',sans-serif;
  background:linear-gradient(135deg,#1a0040,#3b0764,#1e0a3c,#2e1065);
  background-size:400% 400%;
  animation:bgFlow 15s ease infinite;
  color:#e9d5ff;
  overflow-x:hidden;
}
@keyframes bgFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

#starCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.floaters{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.floater{position:absolute;animation:floatUp linear infinite;opacity:0;}
@keyframes floatUp{0%{transform:translateY(105vh) rotate(0deg);opacity:0;}10%{opacity:0.6;}90%{opacity:0.3;}100%{transform:translateY(-10vh) rotate(360deg);opacity:0;}}

.container{position:relative;z-index:2;max-width:600px;margin:0 auto;padding:30px 16px 50px;}

/* ===== STATUS BAR ===== */
.status-bar{position:fixed;top:0;left:0;right:0;z-index:300;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;text-align:center;font-size:0.72rem;font-weight:700;letter-spacing:0.4px;padding:8px 10px;transform:translateY(-100%);transition:transform 0.3s ease;box-shadow:0 3px 14px rgba(0,0,0,0.35);}
.status-bar.show{transform:translateY(0);}

.lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:400;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
.lightbox-overlay.show{display:flex;}
.lightbox-content{max-width:100%;max-height:72vh;border-radius:10px;object-fit:contain;}
.lightbox-actions{display:flex;gap:14px;margin-top:20px;}
.lightbox-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(192,132,252,0.4);color:#e9d5ff;padding:11px 22px;border-radius:24px;font-family:'Quicksand',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;}
.lightbox-btn:active{background:rgba(192,132,252,0.25);}

.media-actions{display:flex;gap:8px;margin-top:6px;max-width:220px;}
.media-action-btn{flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(192,132,252,0.25);color:#e9d5ff;padding:6px 8px;border-radius:10px;font-size:0.66rem;font-family:'Quicksand',sans-serif;font-weight:700;cursor:pointer;}
.media-action-btn:active{background:rgba(192,132,252,0.22);}


/* ===== LOGIN ===== */
#loginScr{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#1a0040,#3b0764,#1e0a3c,#2e1065);background-size:400% 400%;animation:bgFlow 15s ease infinite;}
.lbox{background:rgba(10,0,30,0.92);border:1px solid rgba(192,132,252,0.35);border-radius:26px;padding:32px 24px;width:100%;max-width:330px;text-align:center;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(100,0,200,0.4);animation:popIn 0.6s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes popIn{from{transform:scale(0.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.ltitle{font-family:'Dancing Script',cursive;font-size:2rem;background:linear-gradient(135deg,#e9d5ff,#c084fc,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;}
.lsub{font-size:0.78rem;color:rgba(192,132,252,0.55);margin-bottom:20px;letter-spacing:1px;}
.user-cards{display:flex;gap:14px;justify-content:center;margin-bottom:4px;}
.ucard{flex:1;padding:14px 8px;border-radius:18px;border:2px solid transparent;cursor:pointer;transition:all 0.3s;text-align:center;}
.ucard:hover{transform:translateY(-4px);}
.ucard.fawaz-c{background:linear-gradient(135deg,rgba(155,28,46,0.3),rgba(225,29,72,0.2));border-color:rgba(225,29,72,0.4);}
.ucard.fawaz-c:hover{border-color:#e11d48;box-shadow:0 8px 25px rgba(225,29,72,0.4);}
.ucard.vis-c{background:linear-gradient(135deg,rgba(91,33,182,0.3),rgba(168,85,247,0.2));border-color:rgba(168,85,247,0.4);}
.ucard.vis-c:hover{border-color:#a855f7;box-shadow:0 8px 25px rgba(168,85,247,0.4);}
.ucard-icon{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:linear-gradient(135deg,#9b1c2e,#e11d48);}
.ucard.vis-c .ucard-icon{background:linear-gradient(135deg,#5b21b6,#7c3aed);}
.ucard-name{font-size:0.82rem;font-weight:700;}
.ucard.fawaz-c .ucard-name{color:#fb7185;}
.ucard.vis-c .ucard-name{color:#c084fc;}
.ucard-sub{font-size:0.65rem;opacity:0.6;margin-top:2px;}
.pass-wrap{display:none;margin-top:4px;}
.pass-in{width:100%;padding:11px 14px;background:rgba(255,255,255,0.07);border:1px solid rgba(192,132,252,0.3);border-radius:12px;color:#e9d5ff;font-family:'Quicksand',sans-serif;font-size:0.9rem;margin-bottom:9px;outline:none;transition:border-color 0.3s;}
.pass-in:focus{border-color:#a855f7;box-shadow:0 0 12px rgba(168,85,247,0.3);}
.pass-in::placeholder{color:rgba(192,132,252,0.35);}
.err{color:#f87171;font-size:0.75rem;margin-bottom:7px;display:none;}
.enter-btn{width:100%;padding:12px;border:none;border-radius:12px;font-family:'Quicksand',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;margin-bottom:7px;transition:all 0.3s;}
.enter-f{background:linear-gradient(135deg,#9b1c2e,#e11d48);color:white;box-shadow:0 5px 16px rgba(225,29,72,0.45);}
.enter-f:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(225,29,72,0.65);}
.enter-v{background:linear-gradient(135deg,#5b21b6,#7c3aed,#c084fc);color:white;box-shadow:0 5px 16px rgba(124,58,237,0.45);}
.enter-v:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(124,58,237,0.65);}
.back-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(192,132,252,0.2);color:#c084fc;width:100%;padding:9px;border-radius:11px;font-family:'Quicksand',sans-serif;cursor:pointer;font-size:0.82rem;}

#mainScr{display:none;}

/* MAIN TITLE */
.main-title{
  text-align:center;
  font-family:'Dancing Script',cursive;
  font-size:clamp(2.4rem,10vw,4rem);
  background:linear-gradient(135deg,#e9d5ff,#c084fc,#a855f7,#e9d5ff);
  background-size:300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:gradFlow 4s ease infinite,gentleFloat 3s ease infinite;
  filter:drop-shadow(0 0 20px rgba(192,132,252,0.6));
  margin-bottom:10px;
}
@keyframes gradFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes gentleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.logged-as{text-align:center;font-size:0.78rem;color:rgba(192,132,252,0.5);margin-bottom:14px;letter-spacing:1px;}
.logged-as span{font-weight:700;}
.logout-link{color:#a855f7;text-decoration:underline;cursor:pointer;margin-left:8px;}

/* TOP BAR: link btn + 3-dot menu */
.top-bar{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:22px;position:relative;}
.link-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(192,132,252,0.3);color:#c084fc;padding:8px 16px;border-radius:20px;font-size:0.75rem;font-family:'Quicksand',sans-serif;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:all 0.3s;}
.link-btn:hover{border-color:#a855f7;background:rgba(168,85,247,0.15);transform:translateY(-2px);}
.bottom-link{display:flex;width:max-content;margin:26px auto 0;font-size:0.95rem;padding:12px 26px;opacity:1;font-weight:700;}
.bottom-link:hover{opacity:1;}

.menu-wrap{position:relative;}
.dots-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(192,132,252,0.3);color:#c084fc;width:34px;height:34px;border-radius:50%;font-size:1.2rem;cursor:pointer;line-height:1;}
.dots-btn:hover{border-color:#a855f7;}
.dropdown{display:none;position:absolute;right:0;top:42px;background:rgba(20,0,45,0.98);border:1px solid rgba(192,132,252,0.3);border-radius:14px;padding:6px;min-width:160px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.dropdown.show{display:block;}
.dropdown-item{padding:10px 12px;font-size:0.8rem;border-radius:9px;cursor:pointer;color:#f87171;font-weight:600;}
.dropdown-item:hover{background:rgba(255,255,255,0.07);}

/* SECTION */
.section{
  margin-bottom:32px;
  background:linear-gradient(135deg,rgba(124,58,237,0.25),rgba(236,72,153,0.15),rgba(168,85,247,0.25));
  background-size:200% 200%;
  animation:giftBgShift 4s ease infinite;
  border:1px solid rgba(236,72,153,0.35);
  border-radius:20px;
  padding:26px 20px;
  backdrop-filter:blur(12px);
  box-shadow:0 8px 30px rgba(124,58,237,0.15);
  opacity:0;transform:translateY(25px);
  transition:opacity 0.7s ease,transform 0.7s ease;
}
.section.visible{opacity:1;transform:translateY(0);}
@keyframes giftBgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.sparkles{text-align:center;font-size:1.4rem;margin-bottom:14px;animation:sparklePulse 1.5s ease infinite;}
@keyframes sparklePulse{0%,100%{opacity:0.5;transform:scale(1);}50%{opacity:1;transform:scale(1.2);}}

/* REPLY BOX */
.reply-box{background:rgba(0,0,0,0.2);border:1px solid rgba(192,132,252,0.2);border-radius:16px;padding:18px 16px;}

.kandu-btn-wrap{text-align:center;margin-bottom:6px;}
.kandu-btn{background:linear-gradient(135deg,#7c3aed,#a855f7,#c084fc);background-size:200%;color:white;border:none;padding:14px 34px;border-radius:26px;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Quicksand',sans-serif;box-shadow:0 5px 18px rgba(124,58,237,0.45);transition:all 0.3s;letter-spacing:1px;animation:linkPulse 2.5s ease infinite;}
@keyframes linkPulse{0%,100%{box-shadow:0 5px 18px rgba(124,58,237,0.45);}50%{box-shadow:0 5px 26px rgba(192,132,252,0.7);}}
.kandu-btn:hover{background-position:right;transform:translateY(-2px);}
.kandu-btn:active{transform:scale(0.96);}

.kandu-log{margin-top:14px;display:flex;flex-direction:column;gap:6px;}
.kandu-item{
  display:flex;align-items:center;gap:8px;
  background:rgba(192,132,252,0.08);
  border:1px solid rgba(192,132,252,0.15);
  border-radius:12px;padding:8px 12px;
  font-size:0.85rem;
  animation:kanduPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.kandu-item.fawaz-item{border-left:3px solid #e11d48;}
.kandu-item.vis-item{border-left:3px solid #a855f7;}
@keyframes kanduPop{from{transform:scale(0.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.kandu-item-text{font-family:'Dancing Script',cursive;font-size:1.1rem;}
.kandu-item-time{font-size:0.62rem;color:rgba(192,132,252,0.4);margin-left:auto;}

/* CHAT (text + voice, unified, WhatsApp style) */
.chat-log{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;margin:16px 0;padding-right:4px;scroll-behavior:smooth;}
.chat-log::-webkit-scrollbar{width:5px;}
.chat-log::-webkit-scrollbar-thumb{background:rgba(192,132,252,0.3);border-radius:10px;}
.chat-bubble{max-width:80%;padding:10px 13px;border-radius:15px;font-size:0.85rem;line-height:1.45;animation:kanduPop 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.chat-bubble.own{align-self:flex-end;background:linear-gradient(135deg,rgba(124,58,237,0.55),rgba(168,85,247,0.4));border-bottom-right-radius:4px;}
.chat-bubble.other{align-self:flex-start;background:rgba(255,255,255,0.07);border-bottom-left-radius:4px;}
.bubble-sender{font-size:0.68rem;font-weight:700;margin-bottom:4px;letter-spacing:0.5px;}
.chat-bubble.fawaz-item .bubble-sender{color:#fb7185;}
.chat-bubble.vis-item .bubble-sender{color:#c084fc;}
.bubble-text{white-space:pre-wrap;word-break:break-word;}
.chat-bubble.voice-msg{background:transparent!important;border:none!important;padding:0;}
.voice-bubble{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;min-width:190px;}
.chat-bubble.own .voice-bubble{background:linear-gradient(135deg,rgba(124,58,237,0.85),rgba(168,85,247,0.7));border-bottom-right-radius:4px;box-shadow:0 4px 13px rgba(124,58,237,0.35);}
.chat-bubble.other .voice-bubble{background:linear-gradient(135deg,rgba(18,0,45,0.92),rgba(109,28,209,0.3));border:1px solid rgba(192,132,252,0.2);border-bottom-left-radius:4px;}
.vplay-btn{width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,0.25);color:white;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.vplay-btn:active{transform:scale(0.9);}
.vwave{flex:1;height:26px;display:flex;align-items:center;gap:2px;}
.vbar{width:3px;background:rgba(255,255,255,0.3);border-radius:2px;height:5px;transition:height 0.08s;}
.vbar.active{background:rgba(255,255,255,0.9);}
.vdur{font-size:0.68rem;color:rgba(255,255,255,0.9);flex-shrink:0;font-weight:700;min-width:68px;text-align:right;}
.chat-bubble.voice-msg .bubble-time{padding:0 4px;}
.bubble-time{font-size:0.6rem;opacity:0.55;margin-top:5px;display:flex;gap:4px;justify-content:flex-end;align-items:center;}
.tick{font-size:0.7rem;color:rgba(255,255,255,0.6);}
.chat-empty{text-align:center;font-size:0.78rem;opacity:0.4;padding:14px 0;}

.mini-card{background:rgba(0,0,0,0.18);border:1px solid rgba(192,132,252,0.15);border-radius:14px;padding:14px 12px;margin-top:14px;}
.mini-card-title{font-size:0.76rem;font-weight:700;color:#c084fc;margin-bottom:8px;letter-spacing:0.5px;}

.voice-record-row{display:flex;align-items:center;gap:10px;margin-top:4px;}
.rec-hint{font-size:0.72rem;color:rgba(192,132,252,0.45);}

.chat-input-row{display:flex;gap:8px;align-items:flex-end;margin-top:6px;}
.text-reply-area{width:100%;min-height:44px;max-height:120px;background:rgba(255,255,255,0.05);border:1px solid rgba(192,132,252,0.25);border-radius:14px;color:#e9d5ff;font-family:'Quicksand',sans-serif;font-size:0.9rem;padding:11px 14px;resize:none;outline:none;transition:border-color 0.3s;flex:1;}
.text-reply-area:focus{border-color:#a855f7;box-shadow:0 0 12px rgba(168,85,247,0.3);}
.text-reply-area::placeholder{color:rgba(192,132,252,0.35);}

.mic-btn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;font-size:1.15rem;cursor:pointer;box-shadow:0 4px 14px rgba(124,58,237,0.4);transition:all 0.3s;}
.mic-btn.recording{background:linear-gradient(135deg,#e11d48,#f43f5e);animation:recPulse 1s ease infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,0.6);}50%{box-shadow:0 0 0 10px rgba(225,29,72,0);}}

.upload-btn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;font-size:1.4rem;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(124,58,237,0.4);}
.upload-btn:active{transform:scale(0.92);}
.media-btn-row{flex-wrap:wrap;}
.cam-btn{font-size:1.1rem;}

.bubble-media{max-width:220px;width:100%;border-radius:12px;margin-top:2px;display:block;}
video.bubble-media{background:#000;}
.bubble-audio-file{width:100%;max-width:230px;margin-top:2px;height:36px;}

.file-chip{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,0.08);text-decoration:none;color:#e9d5ff;margin-top:2px;max-width:230px;}
.file-chip-icon{font-size:1.3rem;flex-shrink:0;}
.file-chip-name{font-size:0.78rem;word-break:break-all;}

.seen-info{font-size:0.58rem;opacity:0.6;margin-left:2px;}

.text-send-btn{display:block;width:100%;margin-top:9px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;border:none;padding:11px;border-radius:10px;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:'Quicksand',sans-serif;box-shadow:0 4px 14px rgba(124,58,237,0.4);transition:all 0.3s;}
.text-send-btn:hover{transform:translateY(-2px);}

.w-cat{position:fixed;bottom:15px;font-size:1.7rem;z-index:5;pointer-events:none;animation:catWalk 14s linear infinite;}
@keyframes catWalk{0%{left:-7%;transform:scaleX(1);}49%{left:107%;transform:scaleX(1);}50%{left:107%;transform:scaleX(-1);}99%{left:-7%;transform:scaleX(-1);}100%{left:-7%;transform:scaleX(1);}}
.b-teddy{position:fixed;right:10px;bottom:15px;font-size:1.6rem;z-index:5;pointer-events:none;animation:tBounce 2.8s ease infinite;}
@keyframes tBounce{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-15px) rotate(4deg);}}

</style>
</head>
<body>

<div id="statusBar" class="status-bar"></div>

<div class="lightbox-overlay" id="lightboxOverlay">
  <div id="lightboxMediaWrap"></div>
  <div class="lightbox-actions">
    <button class="lightbox-btn" onclick="downloadCurrentLightboxMedia()">⬇ Download</button>
    <button class="lightbox-btn" onclick="closeLightbox()">✕ Close</button>
  </div>
</div>

<canvas id="starCanvas"></canvas>
<div class="floaters" id="floatersDiv"></div>

<!-- LOGIN -->
<div id="loginScr">
  <div class="lbox">
    <div class="ltitle">Our Space 💜</div>
    <div class="lsub">only for us ✨</div>
    <div class="user-cards" id="selSec">
      <div class="ucard fawaz-c" onclick="selUser('fawaz')">
        <div class="ucard-icon">🌸</div>
        <div class="ucard-name">FAWAZ</div>
        <div class="ucard-sub">cherry blossom 🌸</div>
      </div>
      <div class="ucard vis-c" onclick="selUser('pathumma')">
        <div class="ucard-icon">🪻</div>
        <div class="ucard-name">VISMAYA</div>
        <div class="ucard-sub">lavender 🪻</div>
      </div>
    </div>
    <div class="pass-wrap" id="passSec">
      <input class="pass-in" id="passIn" type="password" placeholder="Password...">
      <div class="err" id="errMsg">Wrong password 🙈</div>
      <button class="enter-btn" id="enterBtn" onclick="doLogin()">Enter 💜</button>
      <button class="back-btn" onclick="goBack()">← Back</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="mainScr">
<div class="w-cat">🐱</div>
<div class="b-teddy">🧸</div>

<div class="container">

  <h1 class="main-title">💜 For You 💜</h1>
  <div class="logged-as">logged in as <span id="loggedAsName"></span><span class="logout-link" onclick="logout()">logout</span></div>

  <div class="top-bar">
    <div class="menu-wrap">
      <button class="dots-btn" onclick="toggleMenu()">⋮</button>
      <div class="dropdown" id="dropdownMenu">
        <div class="dropdown-item" onclick="clearChat()">🗑 Clear chat</div>
      </div>
    </div>
  </div>

  <div class="section" data-section="main">
    <div class="sparkles">✨ 💜 ✨</div>
    <div class="reply-box">
      <div class="kandu-btn-wrap">
        <button class="kandu-btn" onclick="handleKandu(this)">കണ്ടു 💜</button>
      </div>
      <div class="kandu-log"></div>

      <div class="mini-card">
        <div class="mini-card-title">💬 Messages</div>
        <div class="chat-log" id="textChatLog"></div>
        <div class="chat-input-row">
          <textarea class="text-reply-area" placeholder="Type something... 💜"></textarea>
        </div>
        <button class="text-send-btn" onclick="sendTextReply(this)">Send 💜</button>
      </div>

      <div class="mini-card">
        <div class="mini-card-title">🎤 Voice Notes</div>
        <div class="chat-log" id="voiceChatLog"></div>
        <div class="voice-record-row">
          <button class="mic-btn" onclick="toggleRecording(this)">🎤</button>
          <span class="rec-hint">Tap to record a voice note</span>
        </div>
      </div>

      <div class="mini-card">
        <div class="mini-card-title">📎 Files & Media</div>
        <div class="chat-log" id="mediaChatLog"></div>
        <div class="voice-record-row media-btn-row">

// SUPABASE API
async function api(method,path,body){
  const headers={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
  if(method==='POST'||method==='PATCH')headers['Prefer']='return=minimal';
  const r=await fetch(SB+'/rest/v1/'+path,{method,headers,body:body?JSON.stringify(body):undefined});
  if(method==='GET')return r.json();
  return r;
}

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Turns any http(s) URL inside a message into a clickable link, safely (no innerHTML injection)
const URL_REGEX=/(https?:\/\/[^\s]+)/g;
function linkifyInto(el,text){
  let lastIndex=0,match;
  URL_REGEX.lastIndex=0;
  while((match=URL_REGEX.exec(text))){
    if(match.index>lastIndex)el.appendChild(document.createTextNode(text.slice(lastIndex,match.index)));
    const a=document.createElement('a');
    a.href=match[0];
    a.textContent=match[0];
    a.target='_blank';
    a.rel='noopener noreferrer';
    a.style.color='#c084fc';
    a.style.textDecoration='underline';
    a.style.wordBreak='break-all';
    el.appendChild(a);
    lastIndex=match.index+match[0].length;
  }
  if(lastIndex<text.length)el.appendChild(document.createTextNode(text.slice(lastIndex)));
}

// PHOTO / VIDEO UPLOAD — files go to a Supabase Storage bucket ('media'), only the public URL is stored in the DB
async function handleMediaSelect(e){
  const file=e.target.files[0];
  e.target.value=''; // reset so the same file can be picked again later
  if(!file)return;
  let mtype='file';
  if(file.type.startsWith('image'))mtype='image';
  else if(file.type.startsWith('video'))mtype='video';
  else if(file.type.startsWith('audio'))mtype='audio';
  const maxMB=25;
  if(file.size>maxMB*1024*1024){
    alert('File valuthaanu 😅 '+maxMB+'MB-il thaazhe ulla file try cheyyu');
    return;
  }
  const labels={image:'Photo',video:'Video',audio:'Audio',file:'File'};
  showStatus(labels[mtype]+' upload ആകുന്നു... 📤');
  try{
    const ext=(file.name.split('.').pop()||'dat').toLowerCase();
    const path=Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
    const res=await fetch(`${SB}/storage/v1/object/media/${path}`,{
      method:'POST',
      headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':file.type||'application/octet-stream'},
      body:file
    });
    if(!res.ok)throw new Error('upload failed: '+res.status);
    const publicUrl=`${SB}/storage/v1/object/public/media/${path}`;
    await api('POST','voice_replies',{sender:me,section:'main',media_url:publicUrl,media_type:mtype,media_name:file.name});
  }catch(err){
    console.log('media upload err',err);
    alert('Upload fail aayi 🙏 Storage bucket "media" undo enn check cheyyu, pinne try cheyyu');
  }
  hideStatus();
  loadAllReplies();
}

// VOICE REPLY
async function toggleRecording(btn){
  const section=btn.closest('.section');
  const sec=section.dataset.section;
  if(!isRecording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream);
      audioChunks=[];
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=()=>{
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        const reader=new FileReader();
        reader.onloadend=async()=>{
          showStatus('Voice send ചെയ്യുന്നു... 📤');
          try{
            await api('POST','voice_replies',{sender:me,section:sec,voice_data:reader.result,has_voice:true});
          }catch(err){console.log('voice send err',err);}
          hideStatus();
          loadAllReplies();
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRecorder.start();
      isRecording=true;
      btn.textContent='⏹';
      btn.classList.add('recording');
      showStatus('Recording ചെയ്യുന്നു... 🎙️');
    }catch(err){
      alert('Mic access venam 🎤');
      console.log('mic err',err);
    }
  }else{
    mediaRecorder.stop();
    isRecording=false;
    btn.textContent='🎤';
    btn.classList.remove('recording');
  }
}

// VOICE BUBBLE (play button + waveform + live duration, e.g. 0:14 / 0:15)
// Audio is NOT fetched until the person actually taps play — this is what keeps Supabase egress low.
const voiceDataCache=new Map();
function createVoiceBubble(itemId){
  const div=document.createElement('div');div.className='voice-bubble';
  const pb=document.createElement('button');pb.type='button';pb.className='vplay-btn';pb.textContent='▶';
  let audio=null;
  const wave=document.createElement('div');wave.className='vwave';
  const bars=[];
  for(let i=0;i<12;i++){const b=document.createElement('div');b.className='vbar';wave.appendChild(b);bars.push(b);}
  const dur=document.createElement('span');dur.className='vdur';dur.textContent='0:00 / 0:00';
  let total=0;

  function wireAudio(){
    allAudios.push(audio);
    audio.addEventListener('loadedmetadata',()=>{total=isFinite(audio.duration)?audio.duration:0;dur.textContent='0:00 / '+fmtDur(total);});
    audio.addEventListener('durationchange',()=>{if(isFinite(audio.duration))total=audio.duration;});
    audio.addEventListener('timeupdate',()=>{
      const c=audio.currentTime;dur.textContent=fmtDur(c)+' / '+fmtDur(total);
      const pct=total>0?c/total:0;
      bars.forEach((b,i)=>{const a=i/bars.length<=pct;b.style.height=a?'18px':'5px';b.className='vbar'+(a?' active':'');});
    });
    audio.addEventListener('ended',()=>{pb.textContent='▶';dur.textContent='0:00 / '+fmtDur(total);bars.forEach(b=>{b.style.height='5px';b.className='vbar';});hideStatus();voiceBubblePlaying=false;});
  }

  pb.onclick=async()=>{
    if(audio&&!audio.paused){
      audio.pause();pb.textContent='▶';hideStatus();voiceBubblePlaying=false;
      return;
    }
    if(audio){
      allAudios.forEach(a=>{if(a!==audio)a.pause();});
      audio.play();pb.textContent='⏸';showStatus('വോയ്സ് പ്ലേ ആകുന്നു... 🎵');voiceBubblePlaying=true;
      return;
    }
    // First tap — fetch the actual audio data now (lazy load)
    pb.textContent='⏳';
    try{
      let dataUrl=voiceDataCache.get(itemId);
      if(!dataUrl){
        showStatus('Voice load ആകുന്നു... ⏳');
        const rows=await api('GET',`voice_replies?id=eq.${itemId}&select=voice_data`);
        dataUrl=Array.isArray(rows)&&rows[0]?rows[0].voice_data:null;
        if(dataUrl)voiceDataCache.set(itemId,dataUrl);
      }
      if(!dataUrl){pb.textContent='▶';hideStatus();return;}
      audio=new Audio(dataUrl);
      wireAudio();
      allAudios.forEach(a=>{if(a!==audio)a.pause();});
      audio.play();pb.textContent='⏸';
      showStatus('വോയ്സ് പ്ലേ ആകുന്നു... 🎵');
      voiceBubblePlaying=true;
    }catch(err){console.log('voice load err',err);pb.textContent='▶';hideStatus();}
  };
  div.appendChild(pb);div.appendChild(wave);div.appendChild(dur);
  return div;
}
function fmtDur(s){if(!s||isNaN(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}

// LOAD REPLIES for the single section
async function loadAllReplies(){
  if(firstLoad)showStatus('Chats loading cheyyunnu... 💬');
  try{
    const all=await api('GET','voice_replies?select=id,sender,section,kettu_count,text_reply,has_voice,media_url,media_type,media_name,seen,seen_at,created_at&section=eq.main&order=id.asc&limit=300');
    if(!Array.isArray(all))return;

    const section=document.querySelector('.section');

    // Kandu log
    const kanduLog=section.querySelector('.kandu-log');
    kanduLog.innerHTML='';
    all.filter(i=>i.kettu_count>0).forEach(item=>{
      const div=document.createElement('div');
      div.className='kandu-item '+(item.sender==='fawaz'?'fawaz-item':'vis-item');
      const time=new Date(item.created_at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      const name=NAMES[item.sender];
      div.innerHTML='<span class="kandu-item-text">💜 കണ്ടു'+item.kettu_count+'</span> — <span style="font-size:0.75rem;opacity:0.7;">'+esc(name)+'</span><span class="kandu-item-time">'+time+'</span>';
      kanduLog.appendChild(div);
    });

    // Chat logs — text and voice kept in separate cards
    const textLog=document.getElementById('textChatLog');
    const voiceLog=document.getElementById('voiceChatLog');
    const textItems=all.filter(i=>i.text_reply);
    const voiceItems=all.filter(i=>i.has_voice);
    textLog.innerHTML='';
    if(textItems.length===0)textLog.innerHTML='<div class="chat-empty">No messages yet ✨</div>';
    textItems.forEach(item=>textLog.appendChild(buildBubble(item)));
    textLog.scrollTop=textLog.scrollHeight;

    // Skip rebuilding the voice log while a voice note is actively playing, so it doesn't cut off
    if(!voiceBubblePlaying){
      voiceLog.innerHTML='';
      if(voiceItems.length===0)voiceLog.innerHTML='<div class="chat-empty">No voice notes yet ✨</div>';
      voiceItems.forEach(item=>voiceLog.appendChild(buildBubble(item)));
      voiceLog.scrollTop=voiceLog.scrollHeight;
    }

    // Photos & Videos card
    const mediaLog=document.getElementById('mediaChatLog');
    const mediaItems=all.filter(i=>i.media_url);
    if(!mediaVideoPlaying){
      mediaLog.innerHTML='';
      if(mediaItems.length===0)mediaLog.innerHTML='<div class="chat-empty">No photos/videos yet ✨</div>';
      mediaItems.forEach(item=>mediaLog.appendChild(buildBubble(item)));
      mediaLog.scrollTop=mediaLog.scrollHeight;
    }

    // Mark incoming unseen messages as seen
    all.filter(i=>(i.text_reply||i.has_voice||i.media_url)&&i.sender!==me&&!i.seen&&!markedSeen.has(i.id)).forEach(item=>{
      markedSeen.add(item.id);
      api('PATCH',`voice_replies?id=eq.${item.id}`,{seen:true,seen_at:new Date().toISOString()}).catch(e=>console.log('seen err',e));
    });

  }catch(err){console.log('load err',err);}
  if(firstLoad){hideStatus();firstLoad=false;}
}

// Build one chat bubble (text, voice, or media) — single tick sent, double tick seen, seen time shown
function buildBubble(item){
  const own=item.sender===me;
  const div=document.createElement('div');
  div.className='chat-bubble '+(own?'own':'other')+' '+(item.sender==='fawaz'?'fawaz-item':'vis-item')+((item.has_voice||item.media_url)?' voice-msg':'');
  const time=new Date(item.created_at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

  if(!own){
    const sd=document.createElement('div');sd.className='bubble-sender';sd.textContent=NAMES[item.sender];
    if(item.has_voice||item.media_url)sd.style.padding='0 4px 3px';
    div.appendChild(sd);
  }
  if(item.text_reply){
    const td=document.createElement('div');td.className='bubble-text';linkifyInto(td,item.text_reply);div.appendChild(td);
  }
  if(item.has_voice){
    div.appendChild(createVoiceBubble(item.id));
  }
  if(item.media_url){
    if(item.media_type==='video'){
      const v=document.createElement('video');
      v.className='bubble-media';v.src=item.media_url;v.controls=true;v.playsInline=true;
      v.addEventListener('play',()=>{mediaVideoPlaying=true;showStatus('Video play ആകുന്നു... 🎬');});
      v.addEventListener('pause',()=>{mediaVideoPlaying=false;hideStatus();});
      v.addEventListener('ended',()=>{mediaVideoPlaying=false;hideStatus();});
      div.appendChild(v);
      div.appendChild(buildMediaActions(item.media_url,'video',item.media_name||'video.mp4'));
    }else if(item.media_type==='image'){
      const im=document.createElement('img');
      im.className='bubble-media';im.src=item.media_url;im.loading='lazy';
      div.appendChild(im);
      div.appendChild(buildMediaActions(item.media_url,'image',item.media_name||'photo.jpg'));
    }else if(item.media_type==='audio'){
      const au=document.createElement('audio');
      au.className='bubble-audio-file';au.src=item.media_url;au.controls=true;
      div.appendChild(au);
    }else{
      const chip=document.createElement('a');
      chip.className='file-chip';chip.href=item.media_url;chip.target='_blank';chip.rel='noopener noreferrer';
      const icon=document.createElement('span');icon.className='file-chip-icon';icon.textContent='📄';
      const nm=document.createElement('span');nm.className='file-chip-name';nm.textContent=item.media_name||'File';
      chip.appendChild(icon);chip.appendChild(nm);
      div.appendChild(chip);
    }
  }
  const tdiv=document.createElement('div');tdiv.className='bubble-time';tdiv.textContent=time;
  if(own){
    const tick=document.createElement('span');tick.className='tick';tick.textContent=item.seen?'✓✓':'✓';
    tdiv.appendChild(tick);
    if(item.seen&&item.seen_at){
      const seenSpan=document.createElement('span');seenSpan.className='seen-info';
      const seenTime=new Date(item.seen_at).toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit'});
      seenSpan.textContent='· Seen '+seenTime;
      tdiv.appendChild(seenSpan);
    }
  }
  div.appendChild(tdiv);
  return div;
}

// ===== MEDIA LIGHTBOX (full screen view) + HD DOWNLOAD =====
let currentLightboxUrl=null,currentLightboxName=null;
function openLightbox(url,type,name){
  currentLightboxUrl=url;currentLightboxName=name||'download';
  const wrap=document.getElementById('lightboxMediaWrap');
  wrap.innerHTML='';
  if(type==='video'){
    const v=document.createElement('video');v.src=url;v.controls=true;v.autoplay=true;v.playsInline=true;v.className='lightbox-content';
    wrap.appendChild(v);
  }else{
    const im=document.createElement('img');im.src=url;im.className='lightbox-content';
    wrap.appendChild(im);
  }
  document.getElementById('lightboxOverlay').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightboxOverlay').classList.remove('show');
  document.getElementById('lightboxMediaWrap').innerHTML='';
}
async function downloadMediaFile(url,name){
  showStatus('Download ആകുന്നു... ⬇️');
  try{
    const res=await fetch(url);
    const blob=await res.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name||'download';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(err){console.log('download err',err);alert('Download fail aayi 😅 photo/video onnu long-press cheythu try cheyyu');}
  hideStatus();
}
function downloadCurrentLightboxMedia(){
  if(currentLightboxUrl)downloadMediaFile(currentLightboxUrl,currentLightboxName);
}
// Small ⛶ View / ⬇ Download row shown under every photo/video bubble (original quality — same file as uploaded, no compression)
function buildMediaActions(url,type,name){
  const row=document.createElement('div');row.className='media-actions';
  const viewBtn=document.createElement('button');viewBtn.type='button';viewBtn.className='media-action-btn';viewBtn.textContent='⛶ View';
  viewBtn.onclick=()=>openLightbox(url,type,name);
  const dlBtn=document.createElement('button');dlBtn.type='button';dlBtn.className='media-action-btn';dlBtn.textContent='⬇ Download';
  dlBtn.onclick=()=>downloadMediaFile(url,name);
  row.appendChild(viewBtn);row.appendChild(dlBtn);
  return row;
}
